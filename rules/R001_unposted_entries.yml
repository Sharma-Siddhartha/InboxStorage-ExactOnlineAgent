id: R001
version: 2
monitor: exact-hygiene-monitor
title: Unposted or draft entries older than the agreed number of days
owner: finance_owner
severity: medium
threshold: {setting: unposted_max_days}
sql: |
  SELECT 'entry' AS OBJECT_TYPE, ENTRY_ID AS OBJECT_ID, DIVISION,
         SUM(ABS(AMOUNT_EUR)) / 2 AS AMOUNT_EUR,
         OBJECT_CONSTRUCT('journal', ANY_VALUE(JOURNAL_CODE), 'age_days', DATEDIFF(day, MIN(CREATED_AT), CURRENT_DATE())) AS METRIC
  FROM EXACT.CORE.TRANSACTION_LINES
  WHERE STATUS <> 50      -- 50 = processed, 20 = entered (verified against the Exact schema)
  GROUP BY ENTRY_ID, DIVISION
  HAVING DATEDIFF(day, MIN(CREATED_AT), CURRENT_DATE()) > {unposted_max_days}
